<svg xmlns="http://www.w3.org/2000/svg" width="840" height="508" viewBox="0 0 840 508" role="img" aria-labelledby="t"><title id="t">Featured projects: LLM inference engine (C++ · Vulkan · GLSL): Runs large MoE coding models on ordinary laptop GPUs; Coding agent (Go): Agent that plans, writes and tests code on a local model; Prediction market (Go · SvelteKit · SQLite): Web app for local events, runs on a single-board computer; gobridgesync (Go · open source): Backup to Google Drive + folder sync, Linux / Windows / macOS; Social app (Dart · Go · PostgreSQL): Flutter mobile client with a Go backend; Mobile game (Dart · Flutter): Cross-platform game built with Flutter; Trading systems (Python · PostgreSQL): Market signal engines and automated trading bots; Websites (Go · Ghost · TypeScript): Media and community sites, self-hosted end to end</title><style>.bg{fill:#f4f1ea}.fg{fill:#1a1a1a}.mu{fill:#5a5650}.ln{stroke:#1a1a1a}text{font-family:ui-monospace,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){.bg{fill:#151515}.fg{fill:#e8e4da}.mu{fill:#9a958b}.ln{stroke:#e8e4da}}</style><rect class="bg" width="840" height="508" rx="6"/><rect class="ln" x="8" y="8" width="824" height="492" rx="4" fill="none" stroke-width="1.5"/><text class="mu" x="32" y="44" font-size="14">$ ls ~/projects --featured</text><line class="ln" x1="32" y1="58" x2="808" y2="58" stroke-dasharray="4 4"/><rect class="ln" x="32" y="76" width="380" height="92" rx="4" fill="none"/><text class="fg" x="48" y="102" font-size="15" font-weight="700">LLM inference engine</text><text class="mu" x="48" y="122" font-size="12">C++ · Vulkan · GLSL</text><text class="fg" x="48" y="142" font-size="12">Runs large MoE coding models</text><text class="fg" x="48" y="158" font-size="12">on ordinary laptop GPUs</text><rect class="ln" x="428" y="76" width="380" height="92" rx="4" fill="none"/><text class="fg" x="444" y="102" font-size="15" font-weight="700">Coding agent</text><text class="mu" x="444" y="122" font-size