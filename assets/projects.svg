<svg xmlns="http://www.w3.org/2000/svg" width="840" height="508" viewBox="0 0 840 508" role="img" aria-labelledby="t"><title id="t">Featured personal and open-source projects</title><style>.bg{fill:#f4f1ea}.fg{fill:#1a1a1a}.mu{fill:#5a5650}.ln{stroke:#1a1a1a}text{font-family:ui-monospace,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){.bg{fill:#151515}.fg{fill:#e8e4da}.mu{fill:#9a958b}.ln{stroke:#e8e4da}}</style><rect class="bg" width="840" height="508" rx="6"/><rect class="ln" x="8" y="8" width="824" height="492" rx="4" fill="none" stroke-width="1.5"/><text class="mu" x="32" y="44" font-size="14">$ ls ~/projects --featured</text><line class="ln" x1="32" y1="58" x2="808" y2="58" stroke-dasharray="4 4"/><rect class="ln" x="32" y="76" width="380" height="92" rx="4" fill="none"/><text class="fg" x="48" y="102" font-size="15" font-weight="700">AI inference engine</text><text class="fg" x="48" y="132" font-size="12">Runs large language models</text><text class="fg" x="48" y="148" font-size="12">on a single laptop GPU</text><rect class="ln" x="428" y="76" width="380" height="92" rx="4" fill="none"/><text class="fg" x="444" y="102" font-size="15" font-weight="700">Coding agent</text><text class="fg" x="444" y="132" font-size="12">Plans, writes and tests code</text><text class="fg" x="444" y="148" font-size="12">using a local AI model</text><rect class="ln" x="32" y="180" width="380" height="92" rx="4" fill="none"/><text class="fg" x="48" y="206" font-size="15" font-weight="700">Prediction market</text><text class="fg" x="48" y="236" font-size="12">Web app for local events,</text><text class="fg" x="48" y="252" font-size="12">runs on a single-board computer</text><rect class="ln" x="428" y="180" width="380" height="92" rx="4" fill="none"/><text class="fg" x="444" y="206" font-size="15" font-weight="700">Backup and sync tool</text><text class="fg" x="444" y="236" font-size="12">Back up to cloud storage and</text><text class="fg" x="444" y="252" font-size="12">sync folders across computers</text><rect class="ln" x="32" y="284" width="380" height="92" rx="4" fill="none"/><text class="fg" x="48" y="310" font-size="15" font-weight="700">Social app</text><text class="fg" x="48" y="340" font-size="12">Mobile social platform</text><text class="fg" x="48" y="356" font-size="12">with a custom backend</text><rect class="ln" x="428" y="284" width="380" height="92" rx="4" fill="none"/><text class="fg" x="444" y="310" font-size="15" font-weight="700">Mobile game</text><text class="fg" x="444" y="340" font-size="12">Cross-platform game</text><text class="fg" x="444" y="356" font-size="12">for Android and iOS</text><rect class="ln" x="32" y="388" width="380" height="92" rx="4" fill="none"/><text class="fg" x="48" y="414" font-size="15" font-weight="700">Trading systems</text><text class="fg" x="48" y="444" font-size="12">Market signal engines</text><text class="fg" x="48" y="460" font-size="12">and automated trading bots</text><rect class="ln" x="428" y="388" width="380" height="92" rx="4" fill="none"/><text class="fg" x="444" y="414" font-size="15" font-weight="700">Websites</text><text class="fg" x="444" y="444" font-size="12">Media and community sites,</text><text class="fg" x="444" y="460" font-size="12">self-hosted end to end</text></svg>
