<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" role="img" aria-labelledby="t"><title id="t">Timeline from 2011 to present</title><style>.bg{fill:#f4f1ea}.fg{fill:#1a1a1a}.mu{fill:#5a5650}.ln{stroke:#1a1a1a}text{font-family:ui-monospace,Menlo,Consolas,monospace}@media (prefers-color-scheme:dark){.bg{fill:#151515}.fg{fill:#e8e4da}.mu{fill:#9a958b}.ln{stroke:#e8e4da}}</style><rect class="bg" width="880" height="580" rx="6"/><rect class="ln" x="8" y="8" width="864" height="564" rx="4" fill="none" stroke-width="1.5"/><text class="mu" x="32" y="44" font-size="14">$ git log --reverse --since=2011</text><line class="ln" x1="32" y1="58" x2="848" y2="58" stroke-dasharray="4 4"/><line class="ln" x1="92" y1="84" x2="92" y2="516" stroke-width="2"/><circle class="fg" cx="92" cy="84" r="6"/><text class="fg" x="32" y="89" font-size="14" font-weight="700">2011</text><text class="fg" x="116" y="89" font-size="15" font-weight="700">Curiosity</text><text class="mu" x="116" y="109" font-size="12">Taking games apart on a slow machine to see how they worked.</text><text class="mu" x="116" y="125" font-size="12">Memory editing, modding, learning to read a system.</text><circle class="fg" cx="92" cy="156" r="6"/><text class="fg" x="32" y="161" font-size="14" font-weight="700">2013</text><text class="fg" x="116" y="161" font-size="15" font-weight="700">How things defend themselves</text><text class="mu" x="116" y="181" font-size="12">From breaking things to understanding protection.</text><text class="mu" x="116" y="197" font-size="12">Memory, processes, and what runs underneath.</text><circle class="fg" cx="92" cy="228" r="6"/><text class="fg" x="32" y="233" font-size="14" font-weight="700">2015</text><text class="fg" x="116" y="233" font-size="15" font-weight="700">Self-taught</text><text class="mu" x="116" y="253" font-size="12">Learned to code by reading, testing, and building.</text><text class="mu" x="116" y="269" font-size="12">First apps written on a phone.</text><circle class="fg" cx="92" cy="300" r="6"/><text class="fg" x="32" y="305" font-size="14" font-weight="700">2016</text><text class="fg" x="116" y="305" font-size="15" font-weight="700">Game studio</text><text class="mu" x="116" y="325" font-size="12">Founded a studio. White-label game development</text><text class="mu" x="116" y="341" font-size="12">for international clients under NDA.</text><circle class="fg" cx="92" cy="372" r="6"/><text class="fg" x="32" y="377" font-size="14" font-weight="700">2017</text><text class="fg" x="116" y="377" font-size="15" font-weight="700">Trading systems</text><text class="mu" x="116" y="397" font-size="12">Automated trading and market analysis tools.</text><text class="mu" x="116" y="413" font-size="12">Still running and improving them today.</text><circle class="fg" cx="92" cy="444" r="6"/><text class="fg" x="32" y="449" font-size="14" font-weight="700">2019</text><text class="fg" x="116" y="449" font-size="15" font-weight="700">Security research</text><text class="mu" x="116" y="469" font-size="12">White-hat group with researchers across five countries.</text><text class="mu" x="116" y="485" font-size="12">Finding and fixing vulnerabilities.</text><circle class="fg" cx="92" cy="516" r="6"/><text class="fg" x="32" y="521" font-size="14" font-weight="700">now</text><text class="fg" x="116" y="521" font-size="15" font-weight="700">Building and shipping</text><text class="mu" x="116" y="541" font-size="12">AI systems, apps, platforms and tools.</text><text class="mu" x="116" y="557" font-size="12">All self-hosted, all on my own hardware.</text></svg>
